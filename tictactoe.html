<!DOCTYPE html>
<html>
<script>
    function handleClick(buttonNumber) {
        document.getElementById("button"+buttonNumber).innerText = "X"
    }
</script>
<h1>
TicTacToe
</h1>
<table>
    <tr>
        <td><button id="button0" onclick="handleClick(0)">O</button></td>
        <td><button id="button1" onclick="handleClick(1)">1</button></td>
        <td><button id="button1" onclick="handleClick(2)">2</button></td>
    </tr>
    <tr>
        <td><button id="button1" onclick="handleClick(3)">3</button></td>
        <td><button id="button1" onclick="handleClick(4)">4</button></td>
        <td><button id="button1" onclick="handleClick(5)">5</button></td>
    </tr>
    <tr>
        <td><button id="button1" onclick="handleClick(6)">6</button></td>
        <td><button id="button1" onclick="handleClick(7)">7</button></td>
        <td><button id="button1" onclick="handleClick(8)">8</button></td>
    </tr>
</table>
</html>
