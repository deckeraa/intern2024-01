<!DOCTYPE html>
<html>

<head>
  <title>
    tictactoe game
  </title>

  <style>
    .gameButton {
    min-width: 245px; 
    min-height: 245px;
    background-color: classic blue;
    font-size: 190px;
    } 
    h1 {
    color: classic blue;
    font-size: 25px;
    text-align: center;
    }
    #WinOrLoss {
     font-size: 100px;
     color: classic blue;
     text-align: center;
    }
    .resetButton {
    display: block;
    margin: auto;
    min-width: 150px;
    }
    table {
    margin-left: auto;
    margin-right: auto;
    }
  </style>
</head>

<body>
  <script> 
    let gamegrid = [[null, null, null], [null, null, null], [null, null, null]]
    function twoDtoOneD(row, col) {
      return col + 3*row;
    }
    function oneDtoTwoD(buttonNumber) {
      const row = Math.floor(buttonNumber/3)
      const col = buttonNumber % 3
      return [row, col]
    }
    function markMove(letter, buttonNumber) {
      const [row, col] = oneDtoTwoD(buttonNumber)
      gamegrid[row][col] = letter
      document.getElementById("button"+buttonNumber).innerText = letter
    }
    function markMoveByRowAndCol(letter, row, col) {
      buttonNumber = twoDtoOneD(row, col)
      gamegrid[row][col] = letter
      document.getElementById("button"+buttonNumber).innerText = letter
    }
    function handleClick(buttonNumber) {
      const [row, col] = oneDtoTwoD(buttonNumber)
      console.log("clicked button: ", buttonNumber, row, col)
      console.log("the spot clicked on in gamegrid contains: ", gamegrid[row][col])
      console.log("gamegrid is: ", gamegrid)
      if (gamegrid[row][col] === null) {
        markMove("X", buttonNumber)
        if (isWinner("X")) { 
          handleWin()
        }
        else {
          computerMoveTwo()
          if (isWinner("O")) {
            handleLoss()
          }
        }
      }
    }
    function getOpenSpaces() {
      let openSpaces = [0,1,2,3,4,5,6,7,8]
      return openSpaces.filter(function(buttonNumber) {
        const [row,col] = oneDtoTwoD(buttonNumber)
        return(gamegrid[row][col] === null)
      })
    }
    function randElement(arr) {
      return arr[Math.floor(Math.random() * arr.length)]
    }
    function computerMove() {
      markMove("O", randElement(getOpenSpaces()))
    }
    function isWinner(letter) {
    if (gamegrid[0][0] === letter &&
       gamegrid[0][1] === letter &&
       gamegrid[0][2] === letter) {
       return true
       }
    if (gamegrid[1][0] === letter &&
       gamegrid[1][1] === letter &&
       gamegrid[1][2] === letter) {
       return true}
    if (gamegrid[2][0] === letter &&
       gamegrid[2][1] === letter &&
       gamegrid[2][2] === letter) {
       return true}
   if (gamegrid[0][0] === letter &&
       gamegrid[1][0] === letter &&
       gamegrid[2][0] === letter) {
       return true
       }
    if (gamegrid[0][1] === letter &&
       gamegrid[1][1] === letter &&
       gamegrid[2][1] === letter) {
       return true}
    if (gamegrid[0][2] === letter &&
       gamegrid[1][2] === letter &&
       gamegrid[2][2] === letter) {
       return true}
    if (gamegrid[0][0] === letter &&
       gamegrid[1][1] === letter &&
       gamegrid[2][2] === letter) {
       return true}
    if (gamegrid[2][0] === letter &&
       gamegrid[1][1] === letter &&
       gamegrid[0][2] === letter) {
       return true} 
    }
    
    function computerMoveTwo() {
      for(let col = 0; col < 3; col ++) {
        if(gamegrid[0][col] == gamegrid[1][col] && gamegrid[0][col] && !gamegrid[2][col]) {
          markMoveByRowAndCol("O", 2, col)
          return
        }
        if(gamegrid[1][col] == gamegrid[2][col] && gamegrid[1][col] && !gamegrid[0][col]) {
          markMoveByRowAndCol("O", 0, col)
          return
        }
        if(gamegrid[0][col] == gamegrid[2][col] && gamegrid[2][col] && !gamegrid[1][col]) {
          markMoveByRowAndCol("O", 1, col)
          return
        }
      }
      for(let row = 0; row < 3; row ++) {
        if(gamegrid[row][0] == gamegrid[row][1] && gamegrid[row][0] && !gamegrid[row][2]) {
          markMoveByRowAndCol("O", row, 2)
          return
        }
        if(gamegrid[row][1] == gamegrid[row][2] && gamegrid[row][1] && !gamegrid[row][0]) {
          markMoveByRowAndCol("O", row, 0)
          return
        }
        if(gamegrid[row][0] == gamegrid[row][2] && gamegrid[row][2] && !gamegrid[row][1]) {
          markMoveByRowAndCol("O", row, 1)
          return
        }
      }
      // left diagonal
      //  x |   | 
      //    | x |
      //    |   | x
      if(gamegrid[0][0] == gamegrid[1][1] && gamegrid[0][0] && !gamegrid[2][2]) {
        markMoveByRowAndCol("O", 2, 2)
        return
      }
      if(gamegrid[0][0] == gamegrid[2][2] && gamegrid[0][0] && !gamegrid[1][1]) {
        markMoveByRowAndCol("O", 1, 1)
        return
      }
      if(gamegrid[1][1] == gamegrid[2][2] && gamegrid[1][1] && !gamegrid[0][0]) {
        markMoveByRowAndCol("O", 0, 0)
        return
      }
      // right diagonal
      if(gamegrid[0][2] == gamegrid[1][1] && gamegrid[0][2] && !gamegrid[2][0]) {
        markMoveByRowAndCol("O", 2, 0)
        return
      }
      if(gamegrid[0][2] == gamegrid[2][0] && gamegrid[0][2] && !gamegrid[1][1]) {
        markMoveByRowAndCol("O", 1, 1)
        return
      }
      if(gamegrid[1][1] == gamegrid[2][0] && gamegrid[1][1] && !gamegrid[0][2]) {
        markMoveByRowAndCol("O", 0, 2)
        return
      }

      
      // if we couldn't find a smart move, pick a random valid move
      computerMove()
    }

    function handleWin() {
      document.getElementById("WinOrLoss").innerText = "You Won"
    }

    function handleLoss() {
      document.getElementById("WinOrLoss").innerText = "You Lose"
    }

    function resetGame() {
      gamegrid = [[null, null, null], [null, null, null], [null, null, null]]
      for(let i = 0; i < 9; i++) {
        document.getElementById("button" + i).innerText = ""
      } 
      document.getElementById("WinOrLoss").innerText = ""
    }
  </script>

  <h1>
    TicTacToe
  </h1>
  <button class="resetButton" id="reset" onclick="resetGame()">New Game</button>
  <div id="WinOrLoss"></div>

  <table>
    <tr>
        <td><button class="gameButton" id="button0" onclick="handleClick(0)"></button></td>
        <td><button class="gameButton" id="button1" onclick="handleClick(1)"></button></td>
        <td><button class="gameButton" id="button2" onclick="handleClick(2)"></button></td>
    </tr>
    <tr>
        <td><button class="gameButton" id="button3" onclick="handleClick(3)"></button></td>
        <td><button class="gameButton" id="button4" onclick="handleClick(4)"></button></td>
        <td><button class="gameButton" id="button5" onclick="handleClick(5)"></button></td>
    </tr>
    <tr>
        <td><button class="gameButton" id="button6" onclick="handleClick(6)"></button></td>
        <td><button class="gameButton" id="button7" onclick="handleClick(7)"></button></td>
        <td><button class="gameButton" id="button8" onclick="handleClick(8)"></button></td>
    </tr>
  </table>
</body>
</html>
