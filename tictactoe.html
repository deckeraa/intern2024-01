<!DOCTYPE html>
<html>

<head>
  <title>
    tictactoe game
  </title>

  <style>
    button {
    min-width: 200px; 
    min-height: 200px;
    background-color: red;
    font-size: 150px;
    } 
    h1 {
    color: blue;
    font-size: 50px;
    }
  </style>
</head>

<body>
  <script> 
    let gamegrid = [[null, null, null], [null, null, null], [null, null, null]]
    function twoDtoOneD(row, col) {
      return col + 3*row;
    }
    function oneDtoTwoD(buttonNumber) {
      const row = Math.floor(buttonNumber/3)
      const col = buttonNumber % 3
      return [row, col]
    }
    function markMove(letter, buttonNumber) {
      const [row, col] = oneDtoTwoD(buttonNumber)
      gamegrid[row][col] = letter
      document.getElementById("button"+buttonNumber).innerText = letter
    }
    function markMoveByRowAndCol(letter, row, col) {
      buttonNumber = twoDtoOneD(row, col)
      gamegrid[row][col] = letter
      document.getElementById("button"+buttonNumber).innerText = letter
    }
    function handleClick(buttonNumber) {
      const [row, col] = oneDtoTwoD(buttonNumber)
      console.log("clicked button: ", buttonNumber, row, col)
      console.log("the spot clicked on in gamegrid contains: ", gamegrid[row][col])
      console.log("gamegrid is: ", gamegrid)
      if (gamegrid[row][col] === null) {
        markMove("X", buttonNumber)
        computerMove()
      }
    }
    function getOpenSpaces() {
      let openSpaces = [0,1,2,3,4,5,6,7,8]
      return openSpaces.filter(function(buttonNumber) {
        const [row,col] = oneDtoTwoD(buttonNumber)
        return(gamegrid[row][col] === null)
      })
    }
    function randElement(arr) {
      return arr[Math.floor(Math.random() * arr.length)]
    }
    function computerMove() {
      markMove("O", randElement(getOpenSpaces()))
    }
    function handleWin() {
    
    }

    function handleLoss() {

    }

    function checkWinner() {

    }

  </script>

  <h1>
    TicTacToe
  </h1>

  <table>
    <tr>
        <td><button id="button0" onclick="handleClick(0)"></button></td>
        <td><button id="button1" onclick="handleClick(1)"></button></td>
        <td><button id="button2" onclick="handleClick(2)"></button></td>
    </tr>
    <tr>
        <td><button id="button3" onclick="handleClick(3)"></button></td>
        <td><button id="button4" onclick="handleClick(4)"></button></td>
        <td><button id="button5" onclick="handleClick(5)"></button></td>
    </tr>
    <tr>
        <td><button id="button6" onclick="handleClick(6)"></button></td>
        <td><button id="button7" onclick="handleClick(7)"></button></td>
        <td><button id="button8" onclick="handleClick(8)"></button></td>
    </tr>
  </table>
</body>
</html>
